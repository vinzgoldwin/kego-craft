<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>KEGO · Portfolio</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    @font-face { font-family: Geist; src: url("assets/geist.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: block; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #73779b; }
    body { font-family: Geist, sans-serif; -webkit-font-smoothing: antialiased; color: #191a20; }
    #portfolio { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    #website-wrap, .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    #website-video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .scene { overflow: hidden; }
    .scene-content { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 150px 100px; gap: 64px; }
    #services { z-index: 2; background: #f8f9fb; }
    #services .scene-content { justify-content: center; gap: 76px; }
    h1, h2, p { margin: 0; }
    .services-title { font-size: 104px; font-weight: 430; line-height: .98; letter-spacing: -.065em; }
    .services-title span { display: block; color: #73779b; }
    .service-list { display: flex; flex-direction: column; gap: 38px; }
    .service { display: flex; align-items: center; gap: 48px; min-height: 280px; }
    .service img { display: block; width: 230px; height: 220px; object-fit: contain; flex-shrink: 0; }
    .service h2 { max-width: 590px; font-size: 64px; line-height: 1.08; letter-spacing: -.045em; font-weight: 500; }
    #contact { z-index: 3; background: #272a38; color: #f8f9fb; }
    #contact .scene-content { padding: 160px 100px 180px; gap: 68px; }
    #end-logo { display: block; width: 240px; height: 150px; object-fit: contain; filter: brightness(0) invert(1); }
    .closing-copy { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 42px; }
    #end-prompt { max-width: 810px; font-size: 58px; line-height: 1.15; letter-spacing: -.045em; font-weight: 430; }
    #end-title { max-width: 840px; font-size: 164px; line-height: .99; letter-spacing: -.065em; font-weight: 430; color: #b4b8d6; }
    #end-contact { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 0 26px; border-bottom: 2px solid #777b91; font-size: 43px; line-height: 1.3; letter-spacing: -.035em; }
    #contact-arrow { font-size: 64px; line-height: 1; }
  </style>
</head>
<body>
<main id="portfolio" data-composition-id="kego-portfolio" data-start="0" data-duration="24" data-width="1080" data-height="1920">
  <div id="website-wrap">
    <video id="website-video" class="clip" src="assets/website.mp4" data-start="0" data-duration="17" data-track-index="0" muted playsinline preload="auto"></video>
  </div>
  <section id="services" class="scene clip" data-layout-allow-occlusion data-start="16.4" data-duration="4.7" data-track-index="1" data-layout-allow-overflow>
    <div class="scene-content">
      <h1 class="services-title" id="services-title">What you can <span>hire me for.</span></h1>
      <div class="service-list">
        <div class="service" id="service-web"><img src="assets/website.svg" alt=""><h2>Websites</h2></div>
        <div class="service" id="service-product"><img src="assets/products.svg" alt=""><h2>Products and apps</h2></div>
        <div class="service" id="service-ai"><img src="assets/automation.svg" alt=""><h2>AI and automation</h2></div>
      </div>
    </div>
  </section>
  <section id="contact" class="scene clip" data-start="20.3" data-duration="3.7" data-track-index="2" data-layout-allow-overflow>
    <div class="scene-content">
      <img id="end-logo" src="assets/kego.svg" alt="KEGO">
      <div class="closing-copy">
        <p id="end-prompt">Have something in mind?</p>
        <h1 id="end-title">Let’s build it.</h1>
      </div>
      <div id="end-contact"><span>kegoo.gg@gmail.com</span><span id="contact-arrow" aria-hidden="true">↗</span></div>
    </div>
  </section>
  <audio id="soundtrack" src="assets/soundtrack.wav" data-start="0" data-duration="24" data-track-index="3" data-volume="1"></audio>
</main>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  // The first 17 seconds are captured from the real site, including its native intro.
  tl.from('#website-wrap', { opacity: 0, duration: .12, ease: 'sine.out' }, .1);
  // Incoming panels cover the previous scene; outgoing content never disappears first.
  tl.from('#services', { y: 1920, duration: .55, ease: 'power3.inOut' }, 16.4);
  tl.from('#services-title', { y: 52, opacity: 0, duration: .7, ease: 'expo.out' }, 16.78);
  tl.from('#service-web', { x: 66, opacity: 0, duration: .65, ease: 'power2.out' }, 17.02);
  tl.from('#service-product', { y: 52, opacity: 0, duration: .72, ease: 'power3.out' }, 17.24);
  tl.from('#service-ai', { scale: .95, opacity: 0, duration: .8, ease: 'sine.out' }, 17.46);
  tl.from('#contact', { y: 1920, duration: .65, ease: 'power3.inOut' }, 20.3);
  tl.from('#end-logo', { y: -28, opacity: 0, duration: .65, ease: 'power2.out' }, 20.76);
  tl.from('#end-prompt', { x: -30, opacity: 0, duration: .65, ease: 'sine.out' }, 20.95);
  tl.from('#end-title', { y: 76, opacity: 0, duration: .9, ease: 'expo.out' }, 21.1);
  tl.from('#end-contact', { y: 30, opacity: 0, duration: .65, ease: 'power3.out' }, 21.48);
  tl.from('#contact-arrow', { x: -14, y: 14, duration: .6, ease: 'sine.out' }, 21.68);
  window.__timelines['kego-portfolio'] = tl;
</script>
</body>
</html>
